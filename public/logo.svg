<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="none">
  <!-- Root node — left, vertically centered -->
  <rect x="1" y="7" width="8" height="8" rx="2" fill="#38bdf8"/>
  <!-- Edge: root → top child -->
  <line x1="9" y1="10" x2="15" y2="6" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Edge: root → bottom child -->
  <line x1="9" y1="14" x2="15" y2="18" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Top child -->
  <rect x="15" y="2" width="8" height="8" rx="2" fill="#38bdf8"/>
  <!-- Bottom child -->
  <rect x="15" y="14" width="8" height="8" rx="2" fill="#38bdf8"/>
</svg>
